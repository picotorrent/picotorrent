name: CI
on:
  pull_request:
  push:
    branches:
      - feature/**
      - master
      - modern

permissions:
  contents: read

jobs:
  build:
    name: Build (x64)
    runs-on: windows-latest

    env:
      VCPKG_ROOT: C:\vcpkg
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Export vcpkg binary cache environment
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Build
        run: dotnet cake --platform=x64 --target=Publish --vcpkg-triplet=x64-windows-static-md-rel

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: PicoTorrent-x64-CI-binaries
          path: |
            build-x64/Release/packages/PicoTorrent-*-x64.exe
            build-x64/Release/packages/PicoTorrent-*-x64.msi
            build-x64/Release/packages/PicoTorrent-*-x64.zip
            build-x64/Release/packages/PicoTorrent-*-x64.symbols.zip
